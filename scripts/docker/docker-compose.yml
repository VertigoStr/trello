  #     ENVIRONMENT: development
  #   ports:
  #     - "${BACKEND_PORT:-8000}:8000"
  #   volumes:
  #     - ../backend:/app
  #     - backend_modules:/app/node_modules
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - trello-network

  # Frontend (будет добавлен в следующей фиче)
  # frontend:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   container_name: trello-frontend
  #   restart: unless-stopped
  #   environment:
  #     REACT_APP_API_URL: http://localhost:${BACKEND_PORT:-8000}
  #   ports:
